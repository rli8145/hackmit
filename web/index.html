<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Brain</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
    --text:#e6edf3; --dim:#8b98a5; --accent:#5b9dff;
    --live:#3fb950; --review:#d29922; --superseded:#6e7681;
    --red:#f85149; --amber:#d29922; --violet:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 22px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
  header .tag{color:var(--dim);font-size:12px}
  .grow{flex:1}
  .tokens{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  .ask{display:flex;gap:8px;align-items:center}
  .ask input{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:9px 12px;width:340px;font-size:13px}
  button{background:var(--accent);color:#04121f;border:0;border-radius:8px;
    padding:9px 14px;font-weight:600;cursor:pointer;font-size:13px}
  button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .answer{margin:12px 22px 0;padding:12px 14px;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;
    display:none}
  .answer .cite{color:var(--dim);font-size:12px;margin-top:6px;font-style:italic}
  main{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 62px)}
  .col{overflow-y:auto;padding:18px}
  .col.left{border-right:1px solid var(--line);background:#12161c}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);
    margin:0 0 12px}
  .att{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;margin-bottom:9px;cursor:pointer;border-left:3px solid var(--line)}
  .att:hover{border-color:var(--accent)}
  .att.unowned{border-left-color:var(--red)}
  .att.superseded{border-left-color:var(--amber)}
  .att.assumption_drift{border-left-color:var(--violet)}
  .att.overlap{border-left-color:var(--accent)}
  .att .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .att .m{margin-top:3px}
  .topic{margin:22px 0 8px;color:var(--dim);font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.5px}
  .topic:first-child{margin-top:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;margin-bottom:10px;cursor:pointer}
  .card:hover{border-color:var(--accent)}
  .card .st{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.5px;padding:2px 7px;border-radius:20px;margin-right:8px}
  .st.live{background:rgba(63,185,80,.15);color:var(--live)}
  .st.needs_review{background:rgba(210,153,34,.15);color:var(--review)}
  .st.superseded{background:rgba(110,118,129,.2);color:var(--superseded)}
  .card .stmt{margin:7px 0 6px;font-weight:500}
  .card .meta{color:var(--dim);font-size:12px}
  .edge{color:var(--amber);font-size:12px;margin-top:5px}
  .unowned-dot{color:var(--red)}
  .ingest{background:var(--panel);border:1px dashed var(--line);border-radius:10px;
    padding:14px;margin-bottom:20px}
  .ingest textarea{width:100%;height:86px;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;resize:vertical}
  /* drawer */
  #drawer{position:fixed;top:0;right:0;height:100vh;width:420px;background:var(--panel2);
    border-left:1px solid var(--line);transform:translateX(100%);transition:.18s;
    padding:22px;overflow-y:auto;z-index:5}
  #drawer.open{transform:translateX(0)}
  #drawer .x{float:right;cursor:pointer;color:var(--dim);font-size:20px}
  .ev{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;margin:8px 0;border-left:3px solid var(--accent)}
  .ev a{color:var(--accent);font-size:12px;text-decoration:none}
  .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    margin:16px 0 6px}
  a.src{color:var(--accent);text-decoration:none;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Company Brain</h1>
  <span class="tag">the decision layer for your org</span>
  <div class="grow"></div>
  <div class="ask">
    <input id="q" placeholder="Ask the brain… (e.g. what's our free tier?)"
           onkeydown="if(event.key==='Enter')ask()">
    <button onclick="ask()">Ask</button>
  </div>
  <span class="tokens" id="tok"></span>
</header>
<div class="answer" id="answer"></div>

<main>
  <div class="col left">
    <h2>Needs attention · <span id="attn-count">0</span></h2>
    <div id="attention"></div>
  </div>
  <div class="col">
    <div class="ingest">
      <h2 style="margin-bottom:8px">Add a source</h2>
      <textarea id="src" placeholder="Paste a Slack thread, meeting transcript, or notes… the brain will extract the decision, place it in the graph, and flag conflicts."></textarea>
      <div style="margin-top:8px"><button onclick="ingest()">Extract decision</button></div>
    </div>
    <div id="decisions"></div>
  </div>
</main>

<div id="drawer"></div>

<script>
const $ = s => document.querySelector(s);
async function jget(u){return (await fetch(u)).json();}
async function jpost(u,b){return (await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();}

async function refresh(){
  const [graph, attention, tokens] = await Promise.all(
    [jget('/api/graph'), jget('/api/attention'), jget('/api/tokens')]);
  renderAttention(attention);
  renderDecisions(graph);
  $('#tok').textContent = `⚡ ${tokens.total} tokens`;
}

function renderAttention(items){
  $('#attn-count').textContent = items.length;
  $('#attention').innerHTML = items.map(a=>`
    <div class="att ${a.type}" onclick="openDrawer('${a.decision_id}')">
      <div class="k">${a.type.replace(/_/g,' ')}</div>
      <div class="m">${a.message}</div>
    </div>`).join('') || '<div class="tag">All clear.</div>';
}

function renderDecisions(graph){
  const supersededBy = {};
  graph.edges.filter(e=>e.type==='supersedes').forEach(e=>supersededBy[e.target]=e.source);
  const byTopic = {};
  graph.nodes.forEach(n=>(byTopic[n.topic]=byTopic[n.topic]||[]).push(n));
  let html='';
  for(const [topic,nodes] of Object.entries(byTopic)){
    html += `<div class="topic">${topic}</div>`;
    for(const n of nodes){
      const sup = supersededBy[n.id];
      html += `<div class="card" onclick="openDrawer('${n.id}')">
        <span class="st ${n.status}">${n.status.replace('_',' ')}</span>
        ${n.owner?`<span class="meta">${n.owner}</span>`:`<span class="unowned-dot">● unowned</span>`}
        <div class="stmt">${esc(n.statement)}</div>
        ${sup?`<div class="edge">↑ superseded by ${sup.slice(-12)}</div>`:''}
      </div>`;
    }
  }
  $('#decisions').innerHTML = html;
}

async function openDrawer(id){
  const d = await jget('/api/decision?id='+encodeURIComponent(id));
  if(d.error) return;
  $('#drawer').classList.add('open');
  $('#drawer').innerHTML = `
    <span class="x" onclick="document.getElementById('drawer').classList.remove('open')">✕</span>
    <span class="st ${d.status}" style="font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:20px">${d.status.replace('_',' ')}</span>
    <h2 style="margin-top:14px;color:var(--text);font-size:16px;text-transform:none;letter-spacing:0">${esc(d.statement)}</h2>
    <div class="meta">Owner: ${d.owner||'<span class="unowned-dot">unowned</span>'} · decided ${d.decided_on} · topic ${d.topic}</div>
    ${d.source?`<div class="lbl">Source</div><a class="src" href="${d.source.link}" target="_blank">${d.source.type} — ${d.source.link}</a>`:''}
    ${d.assumptions.length?`<div class="lbl">Assumptions</div>${d.assumptions.map(a=>`<div class="meta">• ${esc(a)}</div>`).join('')}`:''}
    <div class="lbl">Evidence (verbatim)</div>
    ${d.evidence.map(e=>`<div class="ev">"${esc(e.verbatim_quote)}"<br><a href="${e.link}" target="_blank">open in source ↗</a></div>`).join('')||'<div class="meta">—</div>'}
    ${d.edges.length?`<div class="lbl">Relationships</div>${d.edges.map(e=>`<div class="meta">${e.type} → ${e.target_id.slice(-14)}</div>`).join('')}`:''}
  `;
}

async function ask(){
  const q = $('#q').value.trim(); if(!q) return;
  const r = await jpost('/api/query',{q});
  const el = $('#answer'); el.style.display='block';
  el.innerHTML = `${esc(r.answer)}${r.citation?`<div class="cite">cited: "${esc(r.citation)}"</div>`:''}`;
}

async function ingest(){
  const text = $('#src').value.trim(); if(!text) return;
  const r = await jpost('/api/extract',{text, source_type:'paste', date:'2026-03-15'});
  $('#src').value='';
  await refresh();
  if(r.extracted && r.extracted.length) openDrawer(r.extracted[0].id);
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
refresh();
</script>
</body>
</html>
